<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마켓컬리 와이어프레임</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="top-banner">지금 가입하고 최대 1만 2천원 할인 쿠폰 받아가세요!</div>
  <div class="utility-menu" >
    <div class="con utility-con">
      <nav>
        <ul>
          <li class="signup-link">회원가입</li>
          <li>로그인</li>
          <li>고객센터</li>
        </ul>
      </nav>
    </div>
  <div class="main-header">
    <div class="con m-header-con">
      <div class="brand">
        <img src="./image/logo/kurly-logo.svg" alt="로고">
      <div class="brand-tabs">
        <div class="brand-tab active">마켓컬리</div>
        <div class="brand-tab">뷰티컬리</div>
      </div>
      </div>
      <div class="search">검색어를 입력해주세요</div>
      <div class="actions">
        <img src="./image/icon/location.svg" alt="아이콘">
        <img src="./image/icon/favorite.svg" alt="아이콘">
        <img src="./image/icon/cart.svg" alt="아이콘">
      </div>
    </div>
  </div>
</body>
</html>
