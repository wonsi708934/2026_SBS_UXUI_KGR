<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>블루보틀 코리아</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <header id="BBC-01">
    <div class="announcement">원두 및 커피 최대 10% 할인 번들 구매 혜택</div>
    <div class="con header-con">
      <nav class="main-nav">
        <ul>
          <li>쇼핑</li>
          <li>베스트셀러</li>
          <li>카페</li>
          <li>블로그</li>
        </ul>
      </nav>
      <h1 class="logo-box"><img src="/블루보틀/이미지/bluebottle-logo.svg" alt="BLUE BOTTLE COFFEE"></h1>
      <div class="header-util">
        <div class="header-icons">
          <img src="/블루보틀/아이콘/search.svg" alt="검색 아이콘">
          <img src="/블루보틀/아이콘/person.svg" alt="회원 아이콘">
          <img src="/블루보틀/아이콘/cart.svg" alt="장바구니 아이콘">
        </div>
      </div>
    </div>
  </header>
  <section class="main-slider">
    <div class="slide">
      <img class="slide-img" src="/블루보틀/이미지/main-slide-01.jpg" alt="홀리데이 컬렉션">
       <div class="slide-text">
      <h2>2026 홀리데이 컬렉션</h2>
      <p>커피 한 잔으로 전하는 따뜻한 환대의 마음</p>
       </div>
    </div>
  </section>
    </div>
  </section>
</body>
</html>
